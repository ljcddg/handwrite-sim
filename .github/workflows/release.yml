name: Build and Release

on:
  push:
    branches:
      - release # 推送到 release 分支时触发
  workflow_dispatch: # 也可以在 Actions 页面手动触发

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build EXE with PyInstaller
        run: >
          pyinstaller -F main.py --windowed --noconfirm
          -i "assets/ui/3d.ico"
          --add-data "assets/ui/3d.ico;assets/ui"
          --add-data "Fonts;Fonts"
          --add-data "background;background"
          --add-data "presets;presets"
          -n "手写模拟"

      - name: Package release archive
        run: |
          Copy-Item -Path "Fonts" -Destination "dist" -Recurse -Force
          Copy-Item -Path "presets" -Destination "dist" -Recurse -Force
          Compress-Archive -Path "dist/手写模拟.exe", "dist/Fonts", "dist/presets" -DestinationPath "dist/handwrite-sim-win64.zip" -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: handwrite-sim-win64
          path: dist/handwrite-sim-win64.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: dist/handwrite-sim-win64.zip
          generate_release_notes: true
